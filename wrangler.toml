# This file is for LOCAL DEVELOPMENT only (wrangler pages dev).
# Production config is in the Cloudflare Dashboard.
#
# Dashboard 설정 (Pages > planner-001 > Settings > Environment variables):
#   APP_URL              = https://planner-001.pages.dev
#   ANTHROPIC_API_KEY    = sk-ant-...
#   JWT_SECRET           = (랜덤 32자 이상)
#   FIELD_ENCRYPTION_KEY = (랜덤 32자 이상)
#   GOOGLE_CLIENT_ID     = ...apps.googleusercontent.com
#   GOOGLE_CLIENT_SECRET = GOCSPX-...
#   KAKAO_CLIENT_ID      = ...
#   KAKAO_CLIENT_SECRET  = ...
#   NAVER_CLIENT_ID      = ...
#   NAVER_CLIENT_SECRET  = ...
#
# D1 database binding : DB       -> planner-db
# KV namespace binding: SESSIONS -> (KV namespace ID)
#
# 로컬 시크릿은 .dev.vars 파일에 작성 (git 제외됨):
#   cp .dev.vars.example .dev.vars  →  값 입력 후 사용

name = "planner-001"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"

[vars]
APP_URL  = "http://localhost:8788"
SITE_NAME = "Planner 001"
# OAuth Client ID (공개 값 — 시크릿 아님)
GOOGLE_CLIENT_ID = ""
KAKAO_CLIENT_ID  = ""
NAVER_CLIENT_ID  = ""

[[d1_databases]]
binding = "DB"
database_name = "planner-db"
database_id = "d74e0d6a-ba47-4c25-988f-9ff8a831ed7f"

[[kv_namespaces]]
binding = "SESSIONS"
id = "859a873f551c49e393f8cc52188864f5"
