# This file is for LOCAL DEVELOPMENT only (wrangler pages dev).
# Production config is in the Cloudflare Dashboard.
#
# Dashboard 설정 (Pages > planner-001 > Settings):
#   Build command: npm run build
#   Build output directory: dist
#   Environment variables: SITE_URL, SITE_NAME, ANTHROPIC_API_KEY, JWT_SECRET
#   D1 database binding: DB -> planner-db
#   KV namespace binding: SESSIONS
#   Cron trigger: 0 15 31 10 * (Nov 1 KST)

name = "planner-001"
compatibility_date = "2024-01-01"

[vars]
SITE_URL = "https://planner-001.pages.dev"
SITE_NAME = "Planner 001"

[[d1_databases]]
binding = "DB"
database_name = "planner-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID"
