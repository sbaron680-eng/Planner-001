name = "planner-001"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

[vars]
SITE_URL = "https://planner-001.pages.dev"
SITE_NAME = "Planner 001"

[[d1_databases]]
binding = "DB"
database_name = "planner-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID"

# Note: Cron triggers are configured in the Cloudflare Dashboard
# (Workers & Pages > planner-001 > Settings > Triggers)
# Cron: "0 15 31 10 *" = Nov 1 00:00 KST (Oct 31 15:00 UTC)
